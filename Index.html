<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitPulse – Entrena sin límites</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080808;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 0;
      font-family: 'DM Sans', sans-serif;
    }

    .app-shell {
      width: 390px;
      height: 844px;
      background: #0a0a0a;
      border-radius: 48px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 0 10px #1a1a1a, 0 40px 80px rgba(0,0,0,0.6);
    }

    .bg-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 300px 400px at 80% 20%, rgba(255,80,30,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 200px 200px at 10% 80%, rgba(255,140,0,0.12) 0%, transparent 60%);
      z-index: 0;
    }

    .grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    .notch {
      width: 120px;
      height: 34px;
      background: #0a0a0a;
      border-radius: 0 0 20px 20px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }

    .status-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px 0;
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .status-icons { display: flex; gap: 4px; align-items: center; }

    .content {
      position: relative;
      z-index: 5;
      padding: 20px 0 0;
      height: calc(100% - 50px);
      display: flex;
      flex-direction: column;
    }

    .hero-image {
      width: 100%;
      height: 360px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .hero-svg { width: 100%; height: 100%; display: block; }

    .fade-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 160px;
      background: linear-gradient(to bottom, transparent, #0a0a0a);
    }

    .badge {
      position: absolute;
      top: 20px; left: 28px;
      background: rgba(255,80,30,0.2);
      border: 1px solid rgba(255,80,30,0.5);
      color: #ff6b40;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 100px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 28px;
      margin-bottom: 16px;
    }

    .logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: #fff;
      letter-spacing: 0.08em;
    }

    .text-section { padding: 0 28px; margin-top: -40px; position: relative; z-index: 10; }

    .app-tagline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px;
      line-height: 0.92;
      color: #fff;
      letter-spacing: 0.01em;
      margin: 0 0 6px;
    }

    .app-tagline span { color: #ff6b40; }

    .app-subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      line-height: 1.5;
      margin: 12px 0 28px;
      font-weight: 300;
      max-width: 280px;
    }

    .stats-row {
      display: flex;
      margin-bottom: 28px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      overflow: hidden;
    }

    .stat-item {
      flex: 1;
      padding: 16px 12px;
      text-align: center;
      border-right: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
    }

    .stat-item:last-child { border-right: none; }

    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      color: #fff;
      line-height: 1;
      margin-bottom: 3px;
    }

    .stat-label {
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .btn-primary {
      width: 100%;
      padding: 18px;
      background: #ff6b40;
      border: none;
      border-radius: 16px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.98); }

    .btn-primary::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: rgba(255,255,255,0.3);
      border-radius: 16px 16px 0 0;
    }

    .btn-secondary {
      width: 100%;
      padding: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      color: rgba(255,255,255,0.7);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      cursor: pointer;
      font-weight: 400;
      transition: background 0.2s;
    }

    .btn-secondary:hover { background: rgba(255,255,255,0.1); }

    .login-hint {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.3);
    }

    .login-hint a { color: #ff6b40; text-decoration: none; }
    .login-hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="app-shell">
    <div class="notch"></div>
    <div class="bg-glow"></div>
    <div class="grid-lines"></div>

    <!-- Status bar -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <!-- Signal bars -->
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <rect x="0" y="4" width="3" height="8" fill="rgba(255,255,255,0.6)" rx="1"/>
          <rect x="4" y="2" width="3" height="10" fill="rgba(255,255,255,0.6)" rx="1"/>
          <rect x="8" y="0" width="3" height="12" fill="rgba(255,255,255,0.6)" rx="1"/>
          <rect x="12" y="0" width="3" height="12" fill="rgba(255,255,255,0.2)" rx="1"/>
        </svg>
        <!-- Battery -->
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
          <rect x="0.5" y="0.5" width="15" height="11" rx="2" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
          <rect x="2" y="2" width="10" height="8" rx="1" fill="rgba(255,255,255,0.7)"/>
          <path d="M16.5 4v4a2 2 0 0 0 0-4z" fill="rgba(255,255,255,0.4)"/>
        </svg>
      </div>
    </div>

    <div class="content">

      <!-- Hero illustration -->
      <div class="hero-image">
        <svg class="hero-svg" viewBox="0 0 390 360" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="grd1" cx="60%" cy="30%">
              <stop offset="0%" stop-color="#ff6b40" stop-opacity="0.15"/>
              <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="390" height="360" fill="#0a0a0a"/>
          <rect width="390" height="360" fill="url(#grd1)"/>
          <line x1="0" y1="310" x2="390" y2="310" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
          <ellipse cx="195" cy="315" rx="80" ry="10" fill="rgba(0,0,0,0.5)"/>
          <!-- Figura corredor -->
          <ellipse cx="200" cy="175" rx="22" ry="30" fill="#ff6b40" opacity="0.9"/>
          <circle cx="210" cy="130" r="22" fill="#ff6b40" opacity="0.9"/>
          <path d="M190 175 Q155 195 148 230" stroke="#cc4a22" stroke-width="18" stroke-linecap="round" fill="none"/>
          <path d="M215 170 Q255 150 265 130" stroke="#ff6b40" stroke-width="18" stroke-linecap="round" fill="none"/>
          <path d="M195 205 Q185 250 160 295" stroke="#cc4a22" stroke-width="20" stroke-linecap="round" fill="none"/>
          <path d="M205 210 Q240 255 260 300" stroke="#ff6b40" stroke-width="20" stroke-linecap="round" fill="none"/>
          <ellipse cx="155" cy="300" rx="20" ry="9" fill="#cc4a22" transform="rotate(-15 155 300)"/>
          <ellipse cx="264" cy="304" rx="20" ry="9" fill="#ff6b40" transform="rotate(10 264 304)"/>
          <!-- Líneas de movimiento -->
          <line x1="100" y1="145" x2="145" y2="145" stroke="rgba(255,107,64,0.4)" stroke-width="2" stroke-linecap="round"/>
          <line x1="90" y1="158" x2="140" y2="158" stroke="rgba(255,107,64,0.25)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="100" y1="170" x2="145" y2="170" stroke="rgba(255,107,64,0.15)" stroke-width="1" stroke-linecap="round"/>
          <!-- Tarjeta distancia -->
          <rect x="250" y="90" width="118" height="60" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
          <text x="262" y="114" font-family="Bebas Neue, sans-serif" font-size="22" fill="#fff">8.4 KM</text>
          <text x="262" y="132" font-family="DM Sans, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="0.1em">DISTANCIA HOY</text>
          <circle cx="352" cy="108" r="4" fill="#ff6b40"/>
          <!-- Tarjeta frecuencia cardíaca -->
          <rect x="22" y="210" width="100" height="56" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
          <text x="34" y="230" font-family="DM Sans, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="0.08em">FC MEDIA</text>
          <text x="34" y="254" font-family="Bebas Neue, sans-serif" font-size="22" fill="#ff6b40">142 bpm</text>
        </svg>
        <div class="fade-overlay"></div>
        <div class="badge">nueva temporada</div>
      </div>

      <!-- Logo -->
      <div class="logo-area" style="justify-content: flex-end;">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="36" height="36" rx="10" fill="#ff6b40"/>
          <path d="M8 18 L14 10 L20 18 L26 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 24 L14 16 L20 24 L26 16" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
        </svg>
        <span class="logo-text">TrainCore</span>
      </div>

      <!-- Texto y CTAs -->
      <div class="text-section">
        <div class="app-tagline">ENTRENA<br>SIN<br><span>LÍMITES</span></div>
        <p class="app-subtitle">Tu entrenador personal en el bolsillo. Rutinas, métricas y progreso real.</p>

        <div class="stats-row">
          <div class="stat-item">
            <div class="stat-num">12K+</div>
            <div class="stat-label">usuarios</div>
          </div>
          <div class="stat-item">
            <div class="stat-num">300+</div>
            <div class="stat-label">rutinas</div>
          </div>
          <div class="stat-item">
            <div class="stat-num">4.9★</div>
            <div class="stat-label">valoración</div>
          </div>
        </div>

        <button class="btn-primary" onclick="window.location.href='traincore_home_screen.html'">Empezar gratis</button>
        <button class="btn-secondary" onclick="alert('Ir a explorar')">Explorar la app</button>

        <p class="login-hint">¿Ya tienes cuenta? <a href="#">Inicia sesión</a></p>
      </div>

    </div>
  </div>

</body>
</html>
